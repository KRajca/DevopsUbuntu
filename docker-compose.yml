version: '3.8'

services:
  # KONTENER 1: Nasza aplikacja (Python)
  new_service:
    build: .
    container_name: python-app
    expose:
      - "8000"
    networks:
      - my_network

  # KONTENER 2: Serwer Nginx (Proxy)
  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - new_service
    networks:
      - my_network

# Definicja wirtualnej sieci
networks:
  my_network:
    driver: bridge
